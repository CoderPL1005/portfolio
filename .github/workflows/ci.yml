name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    env:
      CHAT_QUOTA_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=portfolio_quota_tests;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_quota_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_quota_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore Portfolio.sln

      - name: Build backend
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test Portfolio.sln --configuration Release --no-build --no-restore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build
