name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    env:
      CHAT_QUOTA_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=portfolio_quota_tests;Username=postgres;Password=postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: portfolio_quota_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_quota_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore Portfolio.sln

      - name: Build backend
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Prepare extensions in ephemeral CI PostgreSQL only
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U postgres -d portfolio_quota_tests -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          psql -h 127.0.0.1 -p 5432 -U postgres -d portfolio_quota_tests -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'

      - name: Test backend
        run: dotnet test Portfolio.sln --configuration Release --no-build --no-restore

      - name: Real PostgreSQL stale-close safety gate (must run 5 tests, no skip)
        env:
          DISCOVERY_RECOVERY_POSTGRES_OPT_IN: '1'
          DISCOVERY_RECOVERY_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=portfolio_quota_tests;Username=postgres;Password=postgres
        run: |
          set -euo pipefail
          dotnet test tests/Portfolio.IntegrationTests --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~DiscoveryStaleClosePostgresTests' \
            --logger 'trx;LogFileName=stale-close-postgres.trx'
          python3 - <<'PYCI'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('tests/Portfolio.IntegrationTests/TestResults').rglob('stale-close-postgres.trx'))
          if len(paths) != 1:
              raise SystemExit(f'STALE_CLOSE_TRX_NOT_FOUND_OR_AMBIGUOUS: {len(paths)}')
          root = ET.parse(paths[0]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('STALE_CLOSE_TEST_COUNTERS_MISSING')
          expected = {'total': 5, 'passed': 5, 'failed': 0, 'notExecuted': 0}
          actual = {name: int(counters.attrib.get(name, -1)) for name in expected}
          print('PostgreSQL stale-close evidence:', actual)
          if actual != expected:
              raise SystemExit(f'STALE_CLOSE_POSTGRES_NOT_VERIFIED: {actual}')
          print('STALE_CLOSE_POSTGRES_5_OF_5_PASS_NO_SKIP')
          PYCI

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build
