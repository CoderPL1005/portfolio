name: Job Discovery Daily V1
on:
  schedule:
    # BUSINESS slots: 07:00, 10:00, 13:00, 16:00, 19:00, 22:00 Asia/Ho_Chi_Minh.
    # GitHub cron is UTC and best-effort; trigger at minutes 11 and 41 to avoid :00/:30 congestion.
    # Both primary (:11) and fallback (:41) map to the same planned business slot and immutable request ID.
    - cron: '11 0 * * *'
    - cron: '41 0 * * *'
    - cron: '11 3 * * *'
    - cron: '41 3 * * *'
    - cron: '11 6 * * *'
    - cron: '41 6 * * *'
    - cron: '11 9 * * *'
    - cron: '41 9 * * *'
    - cron: '11 12 * * *'
    - cron: '41 12 * * *'
    - cron: '11 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (diagnostic_only is read-only and never starts an execution)'
        required: false
        default: 'diagnostic_only'
        type: choice
        options:
          - diagnostic_only
permissions:
  contents: read
concurrency:
  group: discovery-daily-scheduler
  cancel-in-progress: false
jobs:
  schedule:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Classify trigger and verify cron schedule (pure logic; no provider or DB)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DAILY_SLOT: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode || 'diagnostic_only' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, os, sys

          schedules = {
              '11 0 * * *': (0, 11, 'primary', 1, '07:00 ICT', 'yesterday'),
              '41 0 * * *': (0, 41, 'fallback', 1, '07:00 ICT', 'yesterday'),
              '11 3 * * *': (3, 11, 'primary', 2, '10:00 ICT', 'yesterday+today'),
              '41 3 * * *': (3, 41, 'fallback', 2, '10:00 ICT', 'yesterday+today'),
              '11 6 * * *': (6, 11, 'primary', 3, '13:00 ICT', 'yesterday+today'),
              '41 6 * * *': (6, 41, 'fallback', 3, '13:00 ICT', 'yesterday+today'),
              '11 9 * * *': (9, 11, 'primary', 4, '16:00 ICT', 'today'),
              '41 9 * * *': (9, 41, 'fallback', 4, '16:00 ICT', 'today'),
              '11 12 * * *': (12, 11, 'primary', 5, '19:00 ICT', 'today'),
              '41 12 * * *': (12, 41, 'fallback', 5, '19:00 ICT', 'today'),
              '11 15 * * *': (15, 11, 'reserved', 6, '22:00 ICT', 'RESERVED_NONE'),
          }
          if len(schedules) != 11:
              raise SystemExit('CRON_TABLE_INVALID_COUNT')

          now_utc = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          for hour in (0, 3, 6, 9, 12):
              p = f'11 {hour} * * *'
              f = f'41 {hour} * * *'
              if schedules[p][0] != schedules[f][0] or schedules[p][3] != schedules[f][3]:
                  raise SystemExit('CRON_PRIMARY_FALLBACK_MISMATCH')
              planned_iso = now_utc.replace(hour=hour, minute=0, second=0).strftime('%Y-%m-%dT%H:%M:%SZ')
              digest_p = hashlib.sha256(('discovery-daily-v1|' + planned_iso).encode('utf-8')).hexdigest()[:32]
              digest_f = hashlib.sha256(('discovery-daily-v1|' + planned_iso).encode('utf-8')).hexdigest()[:32]
              if digest_p != digest_f:
                  raise SystemExit('CRON_REQUEST_ID_MISMATCH')

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          cron_expr = os.environ.get('DAILY_SLOT', '')
          dispatch_mode = os.environ.get('DISPATCH_MODE', 'diagnostic_only')

          print(f'WORKFLOW_EVENT: {event_name}')
          print(f'ACTUAL_RUNNER_START_UTC: {now_utc.strftime("%Y-%m-%dT%H:%M:%SZ")}')

          if event_name == 'workflow_dispatch':
              if dispatch_mode != 'diagnostic_only':
                  raise SystemExit(f'UNSUPPORTED_DISPATCH_MODE: {dispatch_mode}')
              print('SCHEDULED_CRON_EXPRESSION: NONE')
              print('PLANNED_BUSINESS_SLOT_ICT: NONE (manual diagnostic_only)')
              print('TRIGGER_CLASSIFICATION: manual')
              print('CRON_SELF_CHECK: PASS (11 expressions verified; primary/fallback share slot identity)')
          elif event_name == 'schedule':
              if cron_expr not in schedules:
                  raise SystemExit(f'UNRECOGNIZED_SCHEDULE_EXPRESSION: {cron_expr}')
              hour, minute, kind, slot_num, ict_label, scope = schedules[cron_expr]
              planned_utc = now_utc.replace(hour=hour, minute=0, second=0)
              print(f'SCHEDULED_CRON_EXPRESSION: {cron_expr}')
              print(f'PLANNED_BUSINESS_SLOT_ICT: {ict_label} (slot={slot_num}, planned_utc={planned_utc.strftime("%Y-%m-%dT%H:%M:%SZ")}, scope={scope})')
              print(f'TRIGGER_CLASSIFICATION: {kind}')
          else:
              raise SystemExit(f'UNSUPPORTED_WORKFLOW_EVENT: {event_name}')
          PY

      - name: Reserved 22:00 slot (future CV-submission threshold)
        if: github.event_name == 'schedule' && github.event.schedule == '11 15 * * *'
        run: |
          echo 'RESERVED_SLOT_6: no API or provider request; threshold 5 submitted CVs not implemented.'
          echo 'DAILY_RESULT_STATE: RESERVED_FUTURE_CV_APPLICATION_THRESHOLD'
          echo 'SCHEDULER_RESULT_STATE: RESERVED_FUTURE_CV_APPLICATION_THRESHOLD'
          echo 'EXECUTION_ID: NONE'
          echo 'SKIP_REASON: Slot 6 (22:00 ICT) is reserved until actual submitted CV counting (<5 across first 4 slots) is implemented; no API or provider request sent.'

      - name: Render preflight (safe GET; never requests provider)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule != '11 15 * * *')
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(python3 -c 'import time; print(int(time.time() * 1000))')
          set +e
          # Safe GET can be retried; a POST can NEVER be retried on unknown outcome.
          http_code=$(curl --fail --silent --show-error --connect-timeout 20 --max-time 90 \
            --retry 1 --retry-all-errors --retry-delay 5 \
            --output "$RUNNER_TEMP/discovery-daily-health.json" --write-out '%{http_code}' \
            'https://portfolio-api-forn.onrender.com/health')
          exit_code=$?
          set -e
          end_ms=$(python3 -c 'import time; print(int(time.time() * 1000))')
          duration_ms=$((end_ms - start_ms))
          echo "RENDER_PREFLIGHT_DURATION_MS: $duration_ms"
          echo "RENDER_PREFLIGHT_HTTP_STATUS: $http_code"
          if [ "$exit_code" -ne 0 ]; then
            case "$exit_code" in
              28) failure_class="TIMEOUT" ;;
              6)  failure_class="DNS_FAILURE" ;;
              7)  failure_class="CONNECT_FAILURE" ;;
              35) failure_class="TLS_FAILURE" ;;
              22) failure_class="HTTP_ERROR_$http_code" ;;
              *)  failure_class="CURL_EXIT_$exit_code" ;;
            esac
            echo "RENDER_PREFLIGHT_OUTCOME: FAILED"
            echo "NETWORK_FAILURE_CLASSIFICATION: $failure_class"
            echo "::error::RENDER_PREFLIGHT_FAILED: class=$failure_class curl_exit=$exit_code http=$http_code duration_ms=$duration_ms; no Daily POST sent."
            exit 1
          fi
          python3 - "$RUNNER_TEMP/discovery-daily-health.json" "$duration_ms" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              payload = json.load(f)
          duration_ms = sys.argv[2]
          data = payload.get('data') or {}
          status = data.get('status')
          migrations_ready = data.get('discoveryMigrationsReady')
          commit = data.get('deploymentCommit')
          commit_str = commit if isinstance(commit, str) and len(commit) == 40 else 'UNAVAILABLE'
          print(f'RENDER_DEPLOYMENT_COMMIT: {commit_str}')
          print(f'RENDER_MIGRATIONS_READY: {migrations_ready}')
          if status != 'Healthy' or migrations_ready is not True:
              print('RENDER_PREFLIGHT_OUTCOME: UNHEALTHY')
              raise SystemExit('RENDER_PREFLIGHT_UNHEALTHY: no Daily POST sent')
          print(f'RENDER_PREFLIGHT_OUTCOME: HEALTHY (duration_ms={duration_ms})')
          print('RENDER_PREFLIGHT_HEALTHY: migration-ready; no provider request yet')
          print('PREFLIGHT_LIMITATION_NOTE: GET /health verifies runner network, Render availability, deploymentCommit, and discoveryMigrationsReady only; it does NOT prove authenticated POST /api/v1/discovery-daily/start or end-to-end ingestion.')
          PY

      - name: Complete diagnostic_only run (read-only; never calls Daily POST or provider)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_MODE: ${{ inputs.mode || 'diagnostic_only' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DISPATCH_MODE" = "diagnostic_only"
          echo 'DIAGNOSTIC_MODE: diagnostic_only'
          echo 'DAILY_POST_CALLED: false'
          echo 'PROVIDER_DISPATCHED: false'
          echo 'NEON_MODIFIED: false'
          echo 'EXECUTION_ID: NONE'
          echo 'SKIP_REASON: Manual workflow_dispatch in diagnostic_only mode is strictly read-only; /api/v1/discovery-daily/start is never called.'
          echo 'DIAGNOSTIC_LIMITATION_NOTE: Passing /health preflight in diagnostic_only mode does NOT prove authenticated POST /api/v1/discovery-daily/start or end-to-end scheduled execution.'

      - name: Start authorized daily slot once (no POST retry)
        if: github.event_name == 'schedule' && github.event.schedule != '11 15 * * *'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISCOVERY_WORKER_KEY: ${{ secrets.DISCOVERY_WORKER_KEY }}
          DAILY_SLOT: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "schedule"
          test "$DAILY_SLOT" != "11 15 * * *"
          test -n "$DISCOVERY_WORKER_KEY"
          test -n "$DAILY_SLOT"
          start_ms=$(python3 -c 'import time; print(int(time.time() * 1000))')
          set +e
          status=$(curl --silent --show-error --retry 0 --connect-timeout 20 --max-time 110 \
            --output "$RUNNER_TEMP/discovery-daily-response.json" --write-out '%{http_code}' \
            --request POST 'https://portfolio-api-forn.onrender.com/api/v1/discovery-daily/start' \
            --header "X-Discovery-Worker-Key: $DISCOVERY_WORKER_KEY" \
            --header "X-GitHub-Run-Id: $GITHUB_RUN_ID" \
            --header "X-GitHub-Run-Attempt: $GITHUB_RUN_ATTEMPT" \
            --header "X-Discovery-Daily-Slot: $DAILY_SLOT")
          exit_code=$?
          set -e
          end_ms=$(python3 -c 'import time; print(int(time.time() * 1000))')
          duration_ms=$((end_ms - start_ms))
          echo "DAILY_POST_DURATION_MS: $duration_ms"
          if [ "$exit_code" -ne 0 ]; then
            case "$exit_code" in
              28) failure_class="TIMEOUT_110S" ;;
              6)  failure_class="DNS_FAILURE" ;;
              7)  failure_class="CONNECT_FAILURE" ;;
              35) failure_class="TLS_FAILURE" ;;
              *)  failure_class="CURL_EXIT_$exit_code" ;;
            esac
            echo "Daily POST HTTP status: $status"
            echo "DAILY_RESULT_STATE: UNKNOWN_OUTCOME"
            echo "SCHEDULER_RESULT_STATE: UNKNOWN_OUTCOME"
            echo "NETWORK_FAILURE_CLASSIFICATION: $failure_class"
            echo "EXECUTION_ID: UNKNOWN"
            echo "SKIP_REASON: NONE (POST outcome unknown due to $failure_class)"
            echo "::error::DAILY_POST_OUTCOME_UNKNOWN curl_exit=$exit_code http=$status class=$failure_class. Never retry this POST or provider. Inspect persisted execution first."
            exit 1
          fi
          echo "Daily POST HTTP status: $status"
          if [ "$status" != 202 ]; then
            echo "DAILY_RESULT_STATE: HTTP_ERROR"
            echo "SCHEDULER_RESULT_STATE: HTTP_ERROR"
            echo "NETWORK_FAILURE_CLASSIFICATION: HTTP_STATUS_$status"
            echo "EXECUTION_ID: NONE"
            echo "SKIP_REASON: Daily endpoint rejected request with HTTP $status."
            echo '::error::DAILY_API_REJECTED: no automatic retry; review backend logs and execution history.'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/discovery-daily-response.json" <<'PY'
          import json, sys, uuid
          with open(sys.argv[1], encoding='utf-8') as f:
              payload = json.load(f)
          data = payload.get('data') or {}
          state = data.get('state')
          raw_exec_id = data.get('executionId')
          exec_id_str = 'NONE'
          if isinstance(raw_exec_id, str) and raw_exec_id:
              try:
                  exec_id_str = str(uuid.UUID(raw_exec_id))
              except ValueError:
                  exec_id_str = 'INVALID_FORMAT'

          created_states = {'QUEUED', 'DISPATCHING', 'CLAIMED', 'INGESTING', 'PARTIAL', 'SUCCEEDED'}
          skip_reasons = {
              'ALREADY_CREATED': 'Execution already created for this planned business slot; duplicate prevented.',
              'SKIPPED_ACTIVE': 'Another discovery execution is currently active.',
              'SKIPPED_DAILY_LIMIT': 'Daily scheduled execution limit (6) reached for current UTC day.',
              'SKIPPED_EXPIRED': 'Scheduled trigger arrived after the 90-minute slot expiration window.',
              'DISABLED': 'Daily scheduler is disabled in backend configuration (DailyEnabled=false).',
              'RESERVED_FUTURE_CV_APPLICATION_THRESHOLD': 'Slot 6 is reserved for future CV submission threshold (<5 CVs).',
          }
          success = created_states | set(skip_reasons.keys())
          state_label = state if isinstance(state, str) else 'MISSING'
          scheduler_state = 'CREATED' if state_label in created_states else (state_label if state_label in skip_reasons else 'UNKNOWN_OUTCOME')
          skip_reason = 'NONE' if state_label in created_states else skip_reasons.get(state_label, 'UNEXPECTED_STATE')

          print('DAILY_RESULT_STATE:', state_label)
          print('SCHEDULER_RESULT_STATE:', scheduler_state)
          print('NETWORK_FAILURE_CLASSIFICATION: NONE')
          print('EXECUTION_ID:', exec_id_str)
          print('SKIP_REASON:', skip_reason)
          if state_label in created_states:
              print('END_TO_END_NOTE: HTTP 202 and CREATED state confirm slot acceptance only; verify ingestion worker completion, Neon persistence, and Admin review for end-to-end PASS.')
          if state not in success:
              raise SystemExit('DAILY_UNEXPECTED_STATE: inspect execution; no automatic retry')
          # Do not print the full response, tokens, headers, or JD contents.
          PY
