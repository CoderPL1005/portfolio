name: SocialAPIs job discovery

on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: Authorize up to max_requests HTTP requests, each <=1 deducted credit under current contract
        type: boolean
        default: false
      confirm_free_no_cash:
        description: Free credits available, no auto-top-up, GitHub storage available and spending disabled
        type: boolean
        default: false
      confirm_artifact_data:
        description: Consent to JD/contact text in downloadable artifacts of this PUBLIC repository
        type: boolean
        default: false
      initialize_state:
        description: FIRST run only - initialize empty discovery state
        type: boolean
        default: false
      resume_continuation:
        description: Resume saved core cursor with matching query/date/profile; never fall back to page 1
        type: boolean
        default: false
      reconcile_terminal_failure:
        description: Explicitly reconcile a complete known terminal result before starting a NEW logical execution; never refetch the old attempt
        type: boolean
        default: false
      query:
        description: Optional query override; leave empty with policy.planQueries and Portfolio snapshot
        type: string
        required: false
      start_time:
        description: Optional publication start date YYYY-MM-DD
        type: string
        default: ''
      end_time:
        description: Optional publication end date YYYY-MM-DD
        type: string
        default: ''
      max_requests:
        description: Maximum HTTP requests 1..6, core <=4 plus optional rotating/adaptive
        type: string
        default: '1'
      max_credits:
        description: Maximum deducted Free credits 1..6, no paid fallback
        type: string
        default: '1'
      policy:
        description: JSON legacy profile or portfolioSnapshot plus profile preferences; planQueries=true enables evidence-based planner; target=5
        type: string
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: socialapis-job-discovery-state
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main' && inputs.confirm_live && inputs.confirm_free_no_cash && inputs.confirm_artifact_data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/browser-job-discovery
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline unit and configuration tests (no provider secret)
        run: npm test
      - name: Validate development safeguards and locate previous checkpoint
        id: checkpoint
        uses: actions/github-script@v7
        env:
          INITIALIZE_STATE: ${{ inputs.initialize_state }}
        with:
          retries: 0
          script: |
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('RERUN_DISABLED_USE_A_NEW_MANUAL_RUN');
            const repo = await github.rest.repos.get(context.repo);
            if (repo.data.private) throw new Error('PUBLIC_REPOSITORY_REQUIRED_FOR_THIS_ZERO_COST_PLAN');
            const history = await github.rest.actions.listWorkflowRuns({ ...context.repo,
              workflow_id: 'socialapis-job-discovery.yml', branch: 'main', event: 'workflow_dispatch', per_page: 2 });
            const previous = history.data.workflow_runs.find(run => run.id !== context.runId);
            if (!previous) {
              if (history.data.total_count > 1 || process.env.INITIALIZE_STATE !== 'true') throw new Error('FIRST_RUN_EXPLICIT_INITIALIZATION_REQUIRED');
              core.setOutput('initialize', 'true'); return;
            }
            if (process.env.INITIALIZE_STATE === 'true') throw new Error('CANNOT_RESET_EXISTING_DISCOVERY_HISTORY');
            if (previous.status !== 'completed') throw new Error('PREVIOUS_RUN_NOT_COMPLETED');
            const response = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: previous.id, per_page: 100 });
            if (response.data.total_count > 100) throw new Error('ARTIFACT_HISTORY_REQUIRES_MANUAL_RECONCILIATION');
            const artifacts = response.data.artifacts;
            // Never restore past a later ambiguous claim, including expired ones.
            const pages = artifacts.filter(a => /^socialapis-page-\d+-[1-6]-(claim|result)$/.test(a.name));
            pages.sort((a,b) => Number(b.name.split('-').at(-2)) - Number(a.name.split('-').at(-2)) ||
              Number(b.name.endsWith('-result')) - Number(a.name.endsWith('-result')));
            const state = pages[0] ?? artifacts.find(a => a.name === 'socialapis-discovery-state')
              ?? artifacts.find(a => a.name === 'socialapis-discovery-checkpoint');
            if (!state || state.expired) throw new Error('CHECKPOINT_MISSING_OR_EXPIRED_RESTORE_BACKUP_BEFORE_ANY_PROVIDER_REQUEST');
            core.setOutput('run_id', String(previous.id)); core.setOutput('artifact_name', state.name);
            core.setOutput('artifact_id', String(state.id)); core.setOutput('initialize', 'false');
            const claim = state.name.endsWith('-result') ? artifacts.find(a => a.name === state.name.replace(/-result$/, '-claim')) : null;
            core.setOutput('claim_artifact_id', claim ? String(claim.id) : '');
      - name: Restore prior-run state (never runner-local cache)
        if: steps.checkpoint.outputs.initialize != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: tools/browser-job-discovery/.debug
      - name: Validate profile and display maximum credit exposure before HTTP
        env:
          INITIALIZE_STATE: ${{ steps.checkpoint.outputs.initialize }}
          ARTIFACT_RECEIPT: ${{ steps.checkpoint.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.checkpoint.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ steps.checkpoint.outputs.run_id }}
          CLAIM_ARTIFACT_RECEIPT: ${{ steps.checkpoint.outputs.claim_artifact_id }}
          RECONCILE_TERMINAL_FAILURE: ${{ inputs.reconcile_terminal_failure }}
          DISCOVERY_QUERY: ${{ inputs.query }}
          DISCOVERY_START_TIME: ${{ inputs.start_time }}
          DISCOVERY_END_TIME: ${{ inputs.end_time }}
          DISCOVERY_MAX_REQUESTS: ${{ inputs.max_requests }}
          DISCOVERY_MAX_CREDITS: ${{ inputs.max_credits }}
          DISCOVERY_POLICY: ${{ inputs.policy }}
          RESUME_CONTINUATION: ${{ inputs.resume_continuation }}
        run: node src/cli.mjs --orchestrate init
      - name: Persist initialized state before any HTTP
        uses: actions/upload-artifact@v4
        with:
          name: socialapis-discovery-checkpoint
          path: tools/browser-job-discovery/.debug/socialapis-discovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '1'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '2'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '3'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '4'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '5'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - uses: ./.github/actions/socialapis-discovery-page
        with:
          slot: '6'
          api_key: ${{ secrets.SOCIALAPIS_API_KEY }}
      - name: Final workflow metrics
        run: node src/cli.mjs --orchestrate summary
      - uses: actions/upload-artifact@v4
        with:
          name: socialapis-discovery-state
          path: tools/browser-job-discovery/.debug/socialapis-discovery.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
