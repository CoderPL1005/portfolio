name: Admin Job Discovery ingestion
run-name: Job Discovery ${{ inputs.execution_id }}
on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Backend-created execution UUID only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: admin-discovery-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/browser-job-discovery
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute the single backend-authorized provider slot
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          DISCOVERY_WORKER_KEY: ${{ secrets.DISCOVERY_WORKER_KEY }}
          SOCIALAPIS_API_KEY: ${{ secrets.SOCIALAPIS_API_KEY }}
        run: node src/cli.mjs --execution "$EXECUTION_ID"
