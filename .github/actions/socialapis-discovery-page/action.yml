name: Durable SocialAPIs discovery page
description: One reserved HTTP attempt with awaited pre/post artifact persistence
inputs:
  slot:
    required: true
    description: Bounded orchestration slot 1..6
  api_key:
    required: true
    description: Secret available only to the HTTP step
  checkpoint_key:
    default: ''
    description: AES-256 key for private automatic-sync checkpoints
  import_key:
    default: ''
    description: Import-only machine credential, never a personal Admin token
runs:
  using: composite
  steps:
    - id: claim
      shell: bash
      working-directory: tools/browser-job-discovery
      run: node src/cli.mjs --orchestrate claim
    - name: Encrypt claim for automatic sync
      if: steps.claim.outputs.active == 'true' && env.DISCOVERY_AUTO_ADMIN_SYNC == 'true'
      shell: bash
      working-directory: tools/browser-job-discovery
      env:
        DISCOVERY_CHECKPOINT_KEY: ${{ inputs.checkpoint_key }}
      run: node src/cli.mjs --orchestrate seal
    - id: reservation
      if: steps.claim.outputs.active == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: socialapis-page-${{ github.run_id }}-${{ inputs.slot }}-claim
        path: tools/browser-job-discovery/.debug/socialapis-discovery.json${{ env.DISCOVERY_AUTO_ADMIN_SYNC == 'true' && '.enc' || '' }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: One HTTP attempt, never retry
      if: steps.claim.outputs.active == 'true'
      shell: bash
      working-directory: tools/browser-job-discovery
      env:
        ARTIFACT_RECEIPT: ${{ steps.reservation.outputs.artifact-id }}
        ARTIFACT_NAME: socialapis-page-${{ github.run_id }}-${{ inputs.slot }}-claim
        SOCIALAPIS_API_KEY: ${{ inputs.api_key }}
        SOCIALAPIS_LIVE_ENABLED: 'true'
        SOCIALAPIS_FREE_PLAN_CONFIRMED: 'true'
        SOCIALAPIS_NO_CASH_CONFIRMED: 'true'
        SOCIALAPIS_PUBLIC_ARTIFACT_CONSENT: ${{ env.DISCOVERY_AUTO_ADMIN_SYNC != 'true' }}
        SOCIALAPIS_PRIVATE_CHECKPOINT_CONFIRMED: ${{ env.DISCOVERY_AUTO_ADMIN_SYNC }}
      run: node src/cli.mjs --orchestrate page
    - name: Encrypt completed response observations before synchronization
      if: success() && steps.claim.outputs.active == 'true' && env.DISCOVERY_AUTO_ADMIN_SYNC == 'true'
      shell: bash
      working-directory: tools/browser-job-discovery
      env:
        DISCOVERY_CHECKPOINT_KEY: ${{ inputs.checkpoint_key }}
      run: node src/cli.mjs --orchestrate seal
    - id: result
      if: success() && steps.claim.outputs.active == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: socialapis-page-${{ github.run_id }}-${{ inputs.slot }}-result
        path: tools/browser-job-discovery/.debug/socialapis-discovery.json${{ env.DISCOVERY_AUTO_ADMIN_SYNC == 'true' && '.enc' || '' }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
    - name: Automatically import saved observations, never refetch provider
      if: success() && steps.result.outputs.artifact-id != '' && env.DISCOVERY_AUTO_ADMIN_SYNC == 'true'
      shell: bash
      working-directory: tools/browser-job-discovery
      env:
        DISCOVERY_ADMIN_ORIGIN: https://portfolio-api-forn.onrender.com
        DISCOVERY_IMPORT_KEY: ${{ inputs.import_key }}
      run: node src/cli.mjs --orchestrate sync
    - name: Confirm persistence or fail closed
      if: always() && steps.claim.outputs.active == 'true' && steps.result.outputs.artifact-id != ''
      shell: bash
      working-directory: tools/browser-job-discovery
      env:
        ARTIFACT_RECEIPT: ${{ steps.result.outputs.artifact-id }}
        ARTIFACT_NAME: socialapis-page-${{ github.run_id }}-${{ inputs.slot }}-result
        ARTIFACT_RUN_ID: ${{ github.run_id }}
        CLAIM_ARTIFACT_RECEIPT: ${{ steps.reservation.outputs.artifact-id }}
      run: node src/cli.mjs --orchestrate ack
