<header class="public-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Portfolio home">Portfolio<span>.</span></a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.path === '/' }">{{ link.label }}</a>
      }
    </nav>
    <button class="menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true">{{ menuOpen() ? 'Close' : 'Menu' }}</span>
    </button>
  </div>
  @if (menuOpen()) {
    <nav id="mobile-navigation" class="mobile-nav" aria-label="Mobile navigation">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>
  }
</header>
<main class="public-content"><router-outlet /></main>
<app-chat-widget />
<footer class="public-footer">
  <div><strong>Portfolio.</strong><span>Built with care and clear engineering.</span></div>
  <a routerLink="/admin/login">Admin</a>
</footer>
